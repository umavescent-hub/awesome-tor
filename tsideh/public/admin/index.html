<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0806">
  <meta name="color-scheme" content="light">
  <title>Tsideh Kitchen</title>
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/assets/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preload" href="/fonts/syne-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/manrope-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/admin/admin.css">
  <script type="module" src="/admin/admin.js"></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="login-card" novalidate>
      <img class="login-mark" src="/assets/logo-192.webp" width="88" height="88" alt="">
      <p class="wordmark">Tsideh</p>
      <h1 class="login-title">Kitchen</h1>
      <p id="login-notice" class="notice" role="alert" hidden></p>
      <div class="field" id="password-field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="login-submit" class="btn btn-primary btn-block" type="submit">Sign in</button>
    </form>
  </main>

  <div id="app" class="app" hidden>
    <header class="topbar">
      <div class="brand">
        <img class="brand-mark" src="/assets/logo-192.webp" width="40" height="40" alt="">
        <h1 class="brand-name"><span class="visually-hidden">Tsideh </span>Kitchen</h1>
      </div>

      <div class="event-picker">
        <label class="visually-hidden" for="event-select">Pop-up</label>
        <span class="select-wrap select-dark">
          <select id="event-select"></select>
        </span>
        <p id="event-meta" class="event-meta"></p>
      </div>

      <p id="live" class="live" data-state="connecting">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="live-long" class="live-long">Connecting</span>
        <span id="live-short" class="live-short">Connecting</span>
      </p>

      <div class="topbar-tools">
        <button id="logout" class="bar-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4.5H5.5v15H10M14.5 8l4 4-4 4M18.5 12H9.5"/></svg>
          <span class="bar-btn-label">Sign out</span>
        </button>
      </div>

      <div class="tabs" role="tablist" aria-label="Kitchen views">
        <button class="tab" type="button" role="tab" id="tab-orders" aria-controls="panel-orders" data-tab="orders">Orders<span class="tab-count" id="count-orders" hidden></span></button>
        <button class="tab" type="button" role="tab" id="tab-prep" aria-controls="panel-prep" data-tab="prep">Prep</button>
        <button class="tab" type="button" role="tab" id="tab-catering" aria-controls="panel-catering" data-tab="catering">Catering<span class="tab-count tab-count-new" id="count-catering" hidden></span></button>
      </div>
    </header>

    <main>
      <section id="panel-orders" class="panel" role="tabpanel" aria-labelledby="tab-orders" hidden>
        <h2 class="visually-hidden">Orders</h2>
        <div class="toolbar">
          <div class="segmented" role="group" aria-label="Show orders">
            <button class="segment" type="button" data-filter="active" aria-pressed="true"><span>Active</span><span class="segment-count" data-count="active"></span></button>
            <button class="segment" type="button" data-filter="ready" aria-pressed="false"><span>Ready</span><span class="segment-count" data-count="ready"></span></button>
            <button class="segment" type="button" data-filter="picked_up" aria-pressed="false"><span>Picked up</span><span class="segment-count" data-count="picked_up"></span></button>
            <button class="segment" type="button" data-filter="all" aria-pressed="false"><span>All</span><span class="segment-count" data-count="all"></span></button>
          </div>
          <div class="search">
            <label class="visually-hidden" for="order-search">Find an order by code, name or phone</label>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
            <input id="order-search" type="search" placeholder="Find: code, name or phone" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="search">
          </div>
        </div>
        <div id="board"></div>
        <div id="board-empty" class="empty" hidden></div>
      </section>

      <section id="panel-prep" class="panel" role="tabpanel" aria-labelledby="tab-prep" hidden>
        <header class="panel-head">
          <div>
            <h2 class="panel-title">What to prep</h2>
            <p id="prep-event" class="panel-sub"></p>
          </div>
          <div class="panel-actions">
            <button id="print" class="btn btn-quiet" type="button">Print</button>
          </div>
        </header>

        <div class="table-scroll">
          <table class="prep-table">
            <caption>"Paid" counts every paid order, including ready and picked-up ones. "Paying now" means a customer is still on the payment page, so it may not go through.</caption>
            <thead>
              <tr>
                <th scope="col" class="col-item">Item</th>
                <th scope="col" class="num">Paid</th>
                <th scope="col" class="num col-pending">Paying now</th>
                <th scope="col" class="num col-limit">Making</th>
                <th scope="col" class="num">Left to sell</th>
              </tr>
            </thead>
            <tfoot id="prep-total"></tfoot>
          </table>
        </div>
      </section>

      <section id="panel-catering" class="panel" role="tabpanel" aria-labelledby="tab-catering" hidden>
        <header class="panel-head">
          <div>
            <h2 class="panel-title">Catering inquiries</h2>
            <p id="catering-summary" class="panel-sub"></p>
          </div>
        </header>
        <div id="inquiries" class="inquiries"></div>
        <div id="catering-empty" class="empty" hidden></div>
      </section>
    </main>

    <p id="announcer" class="visually-hidden" aria-live="polite"></p>
    <div id="toast" class="toast" hidden>
      <p id="toast-text" class="toast-text"></p>
      <button id="toast-action" class="toast-action" type="button" hidden></button>
    </div>
  </div>
</body>
</html>
